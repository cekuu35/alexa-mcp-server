<!DOCTYPE html>
<html>
<head>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    color: #e0e0e0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }
  .container {
    width: 90%;
    max-width: 1000px;
  }
  .header {
    text-align: center;
    margin-bottom: 30px;
    opacity: 0;
    animation: fadeIn 0.5s ease forwards;
  }
  .header h1 {
    font-size: 28px;
    color: #00d4aa;
    margin-bottom: 8px;
  }
  .header p {
    font-size: 14px;
    color: #8899aa;
  }
  .terminal {
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 20px;
    font-family: 'Cascadia Code', 'Fira Code', monospace;
    font-size: 13px;
    line-height: 1.6;
    min-height: 400px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }
  .terminal-bar {
    display: flex;
    gap: 6px;
    margin-bottom: 15px;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .dot.red { background: #ff5f56; }
  .dot.yellow { background: #ffbd2e; }
  .dot.green { background: #27c93f; }
  .cmd {
    color: #7ee787;
    margin: 10px 0 5px 0;
    white-space: pre-wrap;
  }
  .cmd::before {
    content: '$ ';
    color: #3fb950;
  }
  .response {
    color: #8b949e;
    margin: 5px 0 15px 0;
    padding-left: 20px;
    white-space: pre-wrap;
    border-left: 2px solid #30363d;
  }
  .highlight { color: #00d4aa; }
  .critical { color: #f85149; font-weight: bold; }
  .high { color: #f0883e; font-weight: bold; }
  .medium { color: #d29922; font-weight: bold; }
  .clean { color: #3fb950; font-weight: bold; }
  .label {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: bold;
    margin-right: 5px;
  }
  .label-critical { background: #3d1418; color: #f85149; }
  .label-high { background: #3d2b1a; color: #f0883e; }
  .label-medium { background: #3d3214; color: #d29922; }
  .label-clean { background: #12261e; color: #3fb950; }
  .footer {
    text-align: center;
    margin-top: 25px;
    font-size: 12px;
    color: #586e8c;
    opacity: 0;
    animation: fadeIn 0.5s ease 0.5s forwards;
  }
  @keyframes fadeIn {
    to { opacity: 1; }
  }
  @keyframes typeIn {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .type-anim {
    animation: typeIn 0.3s ease forwards;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🔒 Supabase RLS Security Audit — MCP Server</h1>
      <p>Zero-dependency · MCP spec 2025-11-25 · Streamable HTTP · Alexa+ Track</p>
    </div>
    <div class="terminal">
      <div class="terminal-bar">
        <div class="dot red"></div>
        <div class="dot yellow"></div>
        <div class="dot green"></div>
      </div>
      <div id="output"></div>
    </div>
    <div class="footer">
      github.com/cekuu35/alexa-mcp-server — Public source only · No database access · MIT License
    </div>
  </div>

  <script>
    const output = document.getElementById('output');
    let step = 0;

    function addCmd(text) {
      const el = document.createElement('div');
      el.className = 'cmd type-anim';
      el.textContent = text;
      output.appendChild(el);
    }

    function addResponse(html) {
      const el = document.createElement('div');
      el.className = 'response type-anim';
      el.innerHTML = html;
      output.appendChild(el);
    }

    function addLabel(sev, text) {
      return `<span class="label label-${sev}">${sev.toUpperCase()}</span> ${text}`;
    }

    async function mcpCall(method, params) {
      const payload = { jsonrpc: "2.0", id: Date.now(), method, params };
      if (params) payload.params = params;
      const res = await fetch('http://localhost:3001/mcp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      return res.json();
    }

    async function demo() {
      // Step 1: Start server
      addCmd('npm start');
      addResponse(`<span class="highlight">Supabase RLS Security Audit MCP Server</span>
Listening: http://localhost:3001
MCP endpoint: http://localhost:3001/mcp (Streamable HTTP)
MCP spec: 2025-11-25
Zero dependencies — pure Node.js`);

      await new Promise(r => setTimeout(r, 2000));

      // Step 2: Initialize
      addCmd('# MCP Initialize');
      const init = await mcpCall('initialize', {
        protocolVersion: '2025-11-25',
        capabilities: { tools: {} },
        clientInfo: { name: 'demo', version: '1.0' }
      });
      addResponse(`Server: <span class="highlight">${init.result.serverInfo.name}</span>
Version: ${init.result.serverInfo.version}
Protocol: ${init.result.protocolVersion}
Transport: Streamable HTTP`);
      await new Promise(r => setTimeout(r, 1500));

      // Step 3: List tools
      addCmd('# List available tools');
      const tools = await mcpCall('tools/list');
      addResponse(tools.result.tools.map(t =>
        `<span class="highlight">${t.name}</span> — ${t.description.split('.')[0]}`
      ).join('<br>'));
      await new Promise(r => setTimeout(r, 2000));

      // Step 4: Scan YotoqxonaTizimi
      addCmd('scan_repo --repo Azizbek18/YotoqxonaTizimi');
      const scan1 = await mcpCall('tools/call', {
        name: 'scan_repo',
        arguments: { repo: 'Azizbek18/YotoqxonaTizimi' }
      });
      const report1 = scan1.result.content[0].text;
      // Extract key findings
      const lines = report1.split('\n').filter(l => l.includes('- **'));
      const findingsHtml = lines.map(l => {
        let sev = 'medium';
        if (l.includes('HIGH')) sev = 'high';
        if (l.includes('CRITICAL')) sev = 'critical';
        const clean = l.replace(/- \*\*/g, '').replace(/\*\*/g, '').replace(/\(`[^)]+`\)/g, '');
        return addLabel(sev, clean);
      }).join('<br>');
      addResponse(`<span class="highlight">3 findings detected:</span><br>${findingsHtml}`);
      await new Promise(r => setTimeout(r, 2500));

      // Step 5: Quick summary
      addCmd('get_summary --repo pixelsock/mtxProductConfig');
      const scan2 = await mcpCall('tools/call', {
        name: 'get_summary',
        arguments: { repo: 'pixelsock/mtxProductConfig' }
      });
      const text2 = scan2.result.content[0].text;
      const sev2 = text2.includes('CRITICAL') ? 'critical' : 'medium';
      addResponse(addLabel(sev2, text2));
      await new Promise(r => setTimeout(r, 2000));

      // Step 6: Clean repo
      addCmd('get_summary --repo antifailure/antifailure');
      const scan3 = await mcpCall('tools/call', {
        name: 'get_summary',
        arguments: { repo: 'antifailure/antifailure' }
      });
      const text3 = scan3.result.content[0].text;
      addResponse(addLabel('clean', text3));
      await new Promise(r => setTimeout(r, 2000));

      // Step 7: Get fix
      addCmd('get_fix --pattern login_helper_anon');
      const fix = await mcpCall('tools/call', {
        name: 'get_fix',
        arguments: { pattern: 'login_helper_anon' }
      });
      const fixText = fix.result.content[0].text;
      const fixFirst3 = fixText.split('\n').slice(0, 4).join('\n');
      addResponse(`<span class="highlight">Recommended fix:</span>
<pre style="color:#79c0ff; padding:10px; background:#161b22; border-radius:6px; font-size:11px;">${fixFirst3}...</pre>`);
      await new Promise(r => setTimeout(r, 2000));

      // Step 8: Done
      addCmd('# Done — 3 repos scanned, findings verified, fixes ready');
      addResponse(`<span class="clean">✅ MCP Server fully operational.</span><br>
Tested on: 3 production repos (findings verified)<br>
Zero dependencies · Public source only · MIT License<br><br>
<span class="highlight">github.com/cekuu35/alexa-mcp-server</span>`);
    }

    demo();
  </script>
</body>
</html>
